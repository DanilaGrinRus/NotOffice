name: build-linux
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libfontconfig1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: bash packaging/linux/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NotOffice-linux-x86_64
          path: packages/linux/*.tar.gz
