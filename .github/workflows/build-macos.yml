name: build-macos
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: bash packaging/macos/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NotOffice-macos
          path: dist/*
